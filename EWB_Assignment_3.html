<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 3 — Conditional Logic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #c9d1d9;
      padding: 2rem 1rem; min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 0.25rem; }
    .sub { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; padding: 1.5rem; margin-bottom: 1rem;
    }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.3rem; }
    input {
      width: 100%; padding: 0.6rem 0.8rem; background: #0d1117;
      border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9;
      font-size: 0.9rem; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #58a6ff; }
    button {
      background: #238636; color: white; border: none;
      padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer;
      font-size: 0.9rem; font-weight: 500;
    }
    button:hover { background: #2ea043; }
    pre {
      background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
      padding: 1rem; font-family: 'Consolas', monospace; font-size: 0.85rem;
      line-height: 1.6; white-space: pre-wrap; word-break: break-word;
      min-height: 120px; color: #c9d1d9;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Assignment 3 — Conditional Logic Implementation</h1>
  <p class="sub">Enter a test score. The script uses <code>if / else</code>, <code>switch</code>, and a ternary operator to evaluate the score and determine the grade.</p>

  <div class="card">
    <label>Test Score (0 – 100)</label>
    <input id="score" type="number" placeholder="e.g., 85" min="0" max="100">

    <button onclick="runAssignment()">▶ Evaluate Score</button>
  </div>

  <pre id="output">Click "Evaluate Score" to see the output...</pre>
</div>

<script>
function runAssignment() {
  const output = document.getElementById('output');
  const scoreRaw = document.getElementById('score').value;
  const score = Number(scoreRaw);

  if (isNaN(score) || score < 0 || score > 100) {
    output.textContent = 'Please enter a valid score between 0 and 100.';
    return;
  }

  //using if else to determine grade

  let grade;

  if (score >= 90) {
    grade = 'A';
  } else if (score >= 80) {
    grade = 'B';
  } else if (score >= 70) {
    grade = 'C';
  } else if (score >= 60) {
    grade = 'D';
  } else {
    grade = 'F';
  }

  //Using a switch statement to determine grade (same logic, different construct)
  let gradeSwitch;
  
switch (grade) {
    case 'A' : finalgradeSwitch = 'A'; break;
    case 'B' : finalgradeSwitch = 'B'; break;
    case 'C' : finalgradeSwitch = 'C'; break;
    case 'D' : finalgradeSwitch = 'D'; break;
    default:            finalgradeSwitch = 'F';
  }

  //Using Ternary operator for pass/fail
  const status = score >= 60?' Passed': ' Failed';

  const lines = [
    `Score: ${score}`,
    `Grade: ${finalgradeSwitch}`,
    `Status: ${status}`
  ];

  output.textContent = lines.join('\n');
  console.log(lines.join('\n'));
}
</script>
</body>
</html>
